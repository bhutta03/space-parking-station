<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Parking Station — Control Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1220; --panel: #131B2E; --border: #223049;
    --text: #E7ECF5; --muted: #8996AC;
    --occupied: #4FD1C5; --queue: #F5A623; --free: #2C3A54;
    --danger: #E1636B;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    padding: 28px clamp(16px, 4vw, 40px);
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
  h1 { font-size: 1.4rem; font-weight: 700; margin: 0; letter-spacing: 0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .stat { text-align: right; }
  .stat .num { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; }
  .stat .label { color: var(--muted); font-size: 0.75rem; }
  .grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 18px; }
  .panel h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 14px; font-weight: 500; }
  .bay-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .bay { border: 1px solid var(--border); border-radius: 6px; padding: 12px; transition: border-color 0.2s, background 0.2s; }
  .bay.occ { border-color: var(--occupied); background: rgba(79, 209, 197, 0.07); }
  .bay-id { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1rem; }
  .bay-size { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 3px 0 10px; }
  .bay-craft { font-size: 0.85rem; min-height: 1.2em; word-break: break-word; }
  .bay button { margin-top: 10px; width: 100%; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 4px; padding: 5px; font-family: inherit; font-size: 0.75rem; cursor: pointer; }
  .bay.occ button { border-color: var(--occupied); color: var(--occupied); }
  .bay button:hover { background: var(--border); }
  .queue-list, .log-list { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow-y: auto; }
  .queue-list li { font-size: 0.85rem; padding: 7px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  .queue-list li .p { color: var(--queue); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
  .log-list li { font-size: 0.78rem; color: var(--muted); padding: 5px 0; border-bottom: 1px solid var(--border); }
  .log-list li .t { color: var(--text); }
  .empty { color: var(--muted); font-size: 0.85rem; font-style: italic; }
  .sidebar { display: flex; flex-direction: column; gap: 20px; }
  form { display: grid; grid-template-columns: 1.2fr 1fr 0.8fr auto; gap: 10px; margin-top: 16px; }
  @media (max-width: 600px) { form { grid-template-columns: 1fr 1fr; } }
  input, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 9px 10px; font-family: inherit; font-size: 0.85rem; }
  input:focus, select:focus { outline: 2px solid var(--occupied); outline-offset: -1px; }
  button.primary { background: var(--occupied); color: #06171A; border: none; border-radius: 4px; font-weight: 700; font-size: 0.85rem; cursor: pointer; padding: 9px; }
  button.primary:hover { opacity: 0.9; }
  .controls-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .demo-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 4px; padding: 8px 14px; font-family: inherit; font-size: 0.8rem; cursor: pointer; }
  .demo-btn:hover { color: var(--text); border-color: var(--occupied); }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#0B1220; --panel:#131B2E; --border:#223049; --text:#E7ECF5; --muted:#8996AC; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Space Parking Station</h1>
    <p>Docking bay allocation — best-fit assignment with priority queue</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" id="statFree">–</div><div class="label">Free bays</div></div>
    <div class="stat"><div class="num" id="statOcc">–</div><div class="label">Occupied</div></div>
    <div class="stat"><div class="num" id="statUtil">–</div><div class="label">Utilization</div></div>
    <div class="stat"><div class="num" id="statQueue">–</div><div class="label">Waiting</div></div>
  </div>
</header>

<div class="grid">
  <div class="panel">
    <div class="controls-row">
      <h2 style="margin:0">Bay grid</h2>
      <button class="demo-btn" id="demoBtn">Run demo arrivals</button>
    </div>
    <div class="bay-grid" id="bayGrid" style="margin-top:14px;"></div>

    <h2 style="margin:24px 0 12px">Send new arrival</h2>
    <form id="arrivalForm">
      <input type="text" id="craftId" placeholder="Craft name" required>
      <select id="craftSize">
        <option value="0">Shuttle</option>
        <option value="1">Freighter</option>
        <option value="2">Cruiser</option>
        <option value="3">Interstellar</option>
      </select>
      <input type="number" id="craftPriority" placeholder="Priority" value="0" min="0">
      <button type="submit" class="primary">Send</button>
    </form>
  </div>

  <div class="sidebar">
    <div class="panel">
      <h2>Waiting queue</h2>
      <ul class="queue-list" id="queueList"></ul>
    </div>
    <div class="panel">
      <h2>Event log</h2>
      <ul class="log-list" id="logList"></ul>
    </div>
  </div>
</div>

<script>
const SIZES = ['Shuttle', 'Freighter', 'Cruiser', 'Interstellar'];

let bays = [
  { id: 'B1', maxSize: 0, craft: null },
  { id: 'B2', maxSize: 0, craft: null },
  { id: 'B3', maxSize: 1, craft: null },
  { id: 'B4', maxSize: 2, craft: null },
  { id: 'B5', maxSize: 3, craft: null },
];
let queue = [];
let log = [];

function timestamp() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function addLog(msg) {
  log.unshift({ t: timestamp(), msg });
  log = log.slice(0, 30);
}

function bestFitBay(size) {
  const candidates = bays.filter(b => !b.craft && b.maxSize >= size);
  if (candidates.length === 0) return null;
  return candidates.reduce((a, b) => (a.maxSize <= b.maxSize ? a : b));
}

function requestParking(craft) {
  const bay = bestFitBay(craft.size);
  if (bay) {
    bay.craft = craft;
    addLog(`<span class="t">${craft.id}</span> parked at ${bay.id}`);
  } else {
    queue.push(craft);
    queue.sort((a, b) => b.priority - a.priority);
    addLog(`<span class="t">${craft.id}</span> queued (priority ${craft.priority})`);
  }
}

function releaseBay(bayId) {
  const bay = bays.find(b => b.id === bayId);
  if (!bay || !bay.craft) return;
  addLog(`<span class="t">${bay.craft.id}</span> departed ${bay.id}`);
  bay.craft = null;
  processQueue();
  render();
}

function processQueue() {
  let seated = true;
  while (seated) {
    seated = false;
    for (let i = 0; i < queue.length; i++) {
      const bay = bestFitBay(queue[i].size);
      if (bay) {
        bay.craft = queue[i];
        addLog(`<span class="t">${queue[i].id}</span> seated from queue at ${bay.id}`);
        queue.splice(i, 1);
        seated = true;
        break;
      }
    }
  }
}

function render() {
  const occCount = bays.filter(b => b.craft).length;
  document.getElementById('statFree').textContent = bays.length - occCount;
  document.getElementById('statOcc').textContent = occCount;
  document.getElementById('statUtil').textContent = Math.round((occCount / bays.length) * 100) + '%';
  document.getElementById('statQueue').textContent = queue.length;

  document.getElementById('bayGrid').innerHTML = bays.map(b => `
    <div class="bay ${b.craft ? 'occ' : ''}">
      <div class="bay-id">${b.id}</div>
      <div class="bay-size">Max: ${SIZES[b.maxSize]}</div>
      <div class="bay-craft">${b.craft ? b.craft.id : '<span class="empty">Empty</span>'}</div>
      ${b.craft ? `<button onclick="releaseBay('${b.id}')">Release</button>` : ''}
    </div>
  `).join('');

  const queueList = document.getElementById('queueList');
  queueList.innerHTML = queue.length
    ? queue.map(c => `<li><span>${c.id} · ${SIZES[c.size]}</span><span class="p">P${c.priority}</span></li>`).join('')
    : '<li class="empty">No spacecraft waiting</li>';

  document.getElementById('logList').innerHTML = log.length
    ? log.map(l => `<li><span class="mono">${l.t}</span> — ${l.msg}</li>`).join('')
    : '<li class="empty">No events yet</li>';
}

let craftCounter = 0;
document.getElementById('arrivalForm').addEventListener('submit', e => {
  e.preventDefault();
  const id = document.getElementById('craftId').value.trim() || `Craft-${++craftCounter}`;
  const size = parseInt(document.getElementById('craftSize').value, 10);
  const priority = parseInt(document.getElementById('craftPriority').value, 10) || 0;
  requestParking({ id, size, priority });
  render();
  document.getElementById('craftId').value = '';
});

const DEMO_ARRIVALS = [
  { id: 'Shuttle-Alpha', size: 0, priority: 0 },
  { id: 'Freighter-01', size: 1, priority: 0 },
  { id: 'Cruiser-Zeta', size: 2, priority: 0 },
  { id: 'Interstellar-Ark', size: 3, priority: 0 },
  { id: 'Shuttle-Beta', size: 0, priority: 0 },
  { id: 'VIP-Cruiser', size: 2, priority: 10 },
];

document.getElementById('demoBtn').addEventListener('click', () => {
  bays.forEach(b => b.craft = null);
  queue = [];
  log = [];
  DEMO_ARRIVALS.forEach(craft => requestParking({ ...craft }));
  render();
});

render();
</script>
</body>
</html>
